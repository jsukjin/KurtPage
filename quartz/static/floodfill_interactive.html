<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D FloodFill Visualizer — Acoustic Voxel System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #111820;
    --border: #1a2332;
    --accent-blue: #4fc3f7;
    --accent-green: #81c784;
    --accent-orange: #ffb74d;
    --accent-purple: #ce93d8;
    --accent-pink: #f48fb1;
    --text-dim: #37474f;
    --text-mid: #546e7a;
    --text-bright: #78909c;
    --text-white: #e8f4f8;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text-white);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px;
    gap: 18px;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(79,195,247,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(129,199,132,0.03) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  .header { text-align: center; }
  .header-tag {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--accent-blue);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-white);
    letter-spacing: 0.05em;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 5px;
  }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    gap: 24px;
    font-size: 11px;
    color: var(--text-bright);
    letter-spacing: 0.05em;
  }
  .status-bar span span { font-size: 12px; }
  .c-blue   { color: var(--accent-blue); }
  .c-green  { color: var(--accent-green); }
  .c-orange { color: var(--accent-orange); }
  .c-purple { color: var(--accent-purple); }

  /* ── CANVAS WRAPPER ── */
  .canvas-wrap {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(79,195,247,0.06), 0 0 0 1px rgba(79,195,247,0.04);
    cursor: crosshair;
  }

  /* current cell pulse overlay */
  .pulse-cell {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.22);
    z-index: 10;
    border-radius: 2px;
    animation: pulse 0.28s ease-out forwards;
  }
  @keyframes pulse {
    0%   { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
    border-radius: 2px;
    transition: width 0.08s linear;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mode-group { display: flex; gap: 4px; margin-right: 6px; }

  .btn-mode {
    padding: 6px 14px;
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--border);
    color: var(--text-mid);
  }
  .btn-mode.active-solid {
    background: #1e3a4a;
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .btn-mode.active-erase {
    background: #2a1f2a;
    border-color: var(--accent-purple);
    color: var(--accent-purple);
  }

  .speed-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-mid);
  }
  input[type=range] {
    width: 80px;
    accent-color: var(--accent-blue);
    cursor: pointer;
  }

  .btn {
    padding: 8px 18px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 0.05em;
    background: transparent;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    border: 1px solid var(--border);
    color: var(--text-mid);
  }
  .btn:hover:not(:disabled) { opacity: 0.8; transform: translateY(-1px); }
  .btn:disabled { cursor: not-allowed; opacity: 0.3; }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: var(--surface);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 11px;
    color: var(--text-bright);
  }
  .legend-item:hover { background: #1a2a3a; }
  .legend-item.hovered { background: #1a2a3a; }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── HINT ── */
  .hint {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.9;
    max-width: 520px;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-tag">Acoustic Voxel System</div>
  <div class="header-title">3D FloodFill Visualizer</div>
  <div class="header-sub">BFS Region Detection — 6-directional (3D → 4-directional 2D preview)</div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span>GRID <span class="c-blue" id="st-grid">18×14</span></span>
  <span>REGIONS <span class="c-green" id="st-regions">0</span></span>
  <span>STEP <span class="c-orange" id="st-step">0</span><span style="color:#455a64" id="st-total">/0</span></span>
  <span>PROGRESS <span class="c-purple" id="st-pct">0%</span></span>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvas-wrap">
  <div class="pulse-cell" id="pulse" style="display:none"></div>
  <svg id="grid-svg" style="display:block;"></svg>
</div>

<!-- PROGRESS BAR -->
<div class="progress-wrap" id="prog-wrap">
  <div class="progress-fill" id="prog-fill" style="width:0%"></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="mode-group">
    <button class="btn-mode active-solid" id="btn-solid" onclick="setMode('solid')">■ 건물</button>
    <button class="btn-mode" id="btn-erase" onclick="setMode('erase')">○ 지우기</button>
  </div>

  <div class="speed-group">
    <span>SPEED</span>
    <input type="range" min="5" max="195" value="165" id="speed-slider" oninput="onSpeedChange(this.value)">
    <span class="c-blue" id="speed-label">30ms</span>
  </div>

  <button class="btn" id="btn-reset"    style="color:#546e7a;border-color:#2a3a4a" onclick="reset()">리셋</button>
  <button class="btn" id="btn-step"     style="color:#ffb74d;border-color:#ffb74d" onclick="stepForward()">◀ 스텝</button>
  <button class="btn" id="btn-auto"     style="color:#81c784;border-color:#81c784" onclick="toggleAuto()">▶ 자동</button>
  <button class="btn" id="btn-instant"  style="color:#ce93d8;border-color:#ce93d8" onclick="runInstant()">⚡ 즉시</button>
</div>

<!-- LEGEND -->
<div class="legend" id="legend" style="display:none"></div>

<!-- HINT -->
<div class="hint">
  그리드 클릭으로 건물 추가/삭제 → ▶ 자동 또는 ◀ 스텝으로 BFS FloodFill 진행 확인<br>
  같은 색상 = 연결된 하나의 공간 (Region) / ✕ 패턴 = Solid 장애물
</div>

<script>
// ── 상수 ──
const GRID_W = 18, GRID_H = 14, CELL = 42;
const STATE = { EMPTY: 0, SOLID: 1, FILLED: 2 };

const REGION_COLORS = [
  "#e8f4f8","#fce8d5","#e8f5e9","#f3e5f5",
  "#e0f2f1","#fff8e1","#fce4ec","#e8eaf6",
  "#f1f8e9","#e0f7fa","#fff3e0","#f9fbe7",
  "#ede7f6","#e3f2fd","#fbe9e7","#e8f5e9",
];
const REGION_STROKE = [
  "#4fc3f7","#ffb74d","#81c784","#ce93d8",
  "#4db6ac","#fff176","#f48fb1","#7986cb",
  "#aed581","#4dd0e1","#ffcc02","#c5e1a5",
  "#b39ddb","#90caf9","#ff8a65","#a5d6a7",
];

const DEFAULT_BUILDINGS = [
  [2,1],[3,1],[4,1],[2,2],[4,2],[2,3],[3,3],[4,3],
  [7,4],[8,4],[9,4],[10,4],[7,5],[10,5],[7,6],[8,6],[9,6],[10,6],
  [13,2],[14,2],[15,2],[13,3],[15,3],[13,4],[14,4],[15,4],
  [1,9],[2,9],[3,9],[1,10],[3,10],[1,11],[2,11],[3,11],
  [7,8],[8,8],[9,8],[7,9],[9,9],[7,10],[8,10],[9,10],
  [12,9],[13,9],[14,9],[15,9],[12,10],[15,10],[12,11],[13,11],[14,11],[15,11],
  [5,6],[6,6],[5,7],[6,7],[11,5],[11,6],[11,7],
];

// ── 상태 ──
let baseGrid, displayGrid, regionMap;
let steps = [], stepIdx = 0, regionCount = 0;
let running = false, done = false;
let speed = 30;
let drawMode = 'solid';
let hoveredRegion = null;
let intervalID = null;
let isMouseDown = false;

// ── SVG 요소 참조 ──
const svg = document.getElementById('grid-svg');
const progFill = document.getElementById('prog-fill');
const progWrap = document.getElementById('prog-wrap');
const pulseEl  = document.getElementById('pulse');
const legendEl = document.getElementById('legend');

svg.setAttribute('width',  GRID_W * CELL);
svg.setAttribute('height', GRID_H * CELL);
progWrap.style.width = (GRID_W * CELL) + 'px';

// ── 그리드 유틸 ──
function makeGrid(buildings) {
  const g = Array.from({length: GRID_H}, () => Array(GRID_W).fill(STATE.EMPTY));
  for (const [x, y] of buildings) {
    if (y >= 0 && y < GRID_H && x >= 0 && x < GRID_W) g[y][x] = STATE.SOLID;
  }
  return g;
}

// ── BFS FloodFill ──
function floodFill(grid) {
  const visited = Array.from({length: GRID_H}, () => Array(GRID_W).fill(-1));
  const steps = [];
  let regionID = 0;
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  for (let sy = 0; sy < GRID_H; sy++) {
    for (let sx = 0; sx < GRID_W; sx++) {
      if (grid[sy][sx] === STATE.SOLID || visited[sy][sx] >= 0) continue;
      const queue = [[sx, sy]];
      visited[sy][sx] = regionID;
      steps.push({ type: 'start', x: sx, y: sy, regionID });
      let head = 0;
      while (head < queue.length) {
        const [cx, cy] = queue[head++];
        steps.push({ type: 'visit', x: cx, y: cy, regionID });
        for (const [dx, dy] of dirs) {
          const nx = cx+dx, ny = cy+dy;
          if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
          if (grid[ny][nx] === STATE.SOLID || visited[ny][nx] >= 0) continue;
          visited[ny][nx] = regionID;
          queue.push([nx, ny]);
        }
      }
      steps.push({ type: 'region_done', regionID });
      regionID++;
    }
  }
  return { visited, steps, regionCount: regionID };
}

// ── SVG 렌더 ──
// SVG 네임스페이스
const NS = 'http://www.w3.org/2000/svg';

function createEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// 셀 엘리먼트 풀: cells[y][x]
let cells = [];

function buildSVG() {
  svg.innerHTML = '';

  // 배경
  svg.appendChild(createEl('rect', { width: '100%', height: '100%', fill: '#111820' }));

  // 그리드 라인
  for (let i = 0; i <= GRID_W; i++) {
    svg.appendChild(createEl('line', {
      x1: i*CELL, y1: 0, x2: i*CELL, y2: GRID_H*CELL,
      stroke: '#1a2332', 'stroke-width': 1
    }));
  }
  for (let i = 0; i <= GRID_H; i++) {
    svg.appendChild(createEl('line', {
      x1: 0, y1: i*CELL, x2: GRID_W*CELL, y2: i*CELL,
      stroke: '#1a2332', 'stroke-width': 1
    }));
  }

  // 셀 그룹 생성
  cells = Array.from({length: GRID_H}, (_, y) =>
    Array.from({length: GRID_W}, (_, x) => {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('data-x', x);
      g.setAttribute('data-y', y);
      g.style.cursor = 'crosshair';

      // 이벤트: 드래그 그리기 지원
      g.addEventListener('mousedown', e => { isMouseDown = true; handleCellInteract(x, y, e); });
      g.addEventListener('mouseenter', e => { if (isMouseDown) handleCellInteract(x, y, e); handleHover(x, y); });
      g.addEventListener('mouseleave', () => handleHoverLeave());

      svg.appendChild(g);
      return g;
    })
  );

  renderAllCells();
}

function renderAllCells() {
  for (let y = 0; y < GRID_H; y++)
    for (let x = 0; x < GRID_W; x++)
      renderCell(x, y);
}

function renderCell(x, y) {
  const g = cells[y][x];
  g.innerHTML = '';

  const state = displayGrid[y][x];
  const rid = regionMap ? regionMap[y][x] : -1;
  const isHov = hoveredRegion !== null && rid === hoveredRegion && rid >= 0;

  if (state === STATE.SOLID) {
    const rect = createEl('rect', {
      x: x*CELL+1, y: y*CELL+1,
      width: CELL-2, height: CELL-2,
      fill: '#1e3a4a', stroke: '#4fc3f7', 'stroke-width': 1.5, rx: 2
    });
    g.appendChild(rect);
    // 해치
    g.appendChild(createEl('line', {
      x1: x*CELL+5, y1: y*CELL+5, x2: x*CELL+CELL-5, y2: y*CELL+CELL-5,
      stroke: '#2a5a70', 'stroke-width': 1
    }));
    g.appendChild(createEl('line', {
      x1: x*CELL+5, y1: y*CELL+CELL-5, x2: x*CELL+CELL-5, y2: y*CELL+5,
      stroke: '#2a5a70', 'stroke-width': 1
    }));
  } else if (state === STATE.FILLED && rid >= 0) {
    const bc = REGION_COLORS[rid % REGION_COLORS.length];
    const sc = REGION_STROKE[rid % REGION_STROKE.length];
    const rect = createEl('rect', {
      x: x*CELL+1, y: y*CELL+1,
      width: CELL-2, height: CELL-2,
      fill: isHov ? sc : bc,
      'fill-opacity': isHov ? 0.5 : 0.85,
      stroke: sc,
      'stroke-width': isHov ? 2 : 0.8,
      'stroke-opacity': 0.7,
      rx: 1
    });
    g.appendChild(rect);
  } else {
    // EMPTY — 투명 히트박스
    const rect = createEl('rect', {
      x: x*CELL+1, y: y*CELL+1,
      width: CELL-2, height: CELL-2,
      fill: 'transparent'
    });
    g.appendChild(rect);
  }
}

// ── 호버 ──
function handleHover(x, y) {
  if (!regionMap) return;
  const rid = regionMap[y][x];
  if (rid === hoveredRegion) return;
  const prev = hoveredRegion;
  hoveredRegion = rid >= 0 ? rid : null;

  // 이전/현재 region 셀 갱신
  if (prev !== null) refreshRegionCells(prev);
  if (hoveredRegion !== null) refreshRegionCells(hoveredRegion);
  updateLegendHover();
}
function handleHoverLeave() {
  if (hoveredRegion === null) return;
  const prev = hoveredRegion;
  hoveredRegion = null;
  refreshRegionCells(prev);
  updateLegendHover();
}
function refreshRegionCells(rid) {
  if (!regionMap) return;
  for (let y = 0; y < GRID_H; y++)
    for (let x = 0; x < GRID_W; x++)
      if (regionMap[y][x] === rid) renderCell(x, y);
}

// ── 셀 클릭/드래그 ──
function handleCellInteract(x, y, e) {
  if (running) return;
  const newState = drawMode === 'solid' ? STATE.SOLID : STATE.EMPTY;
  if (baseGrid[y][x] === newState) return;
  baseGrid[y][x] = newState;
  displayGrid[y][x] = newState;
  renderCell(x, y);
  resetState();
}

document.addEventListener('mouseup', () => { isMouseDown = false; });

// ── 상태 리셋 (그리드 유지) ──
function resetState() {
  clearInterval(intervalID);
  running = false; done = false;
  steps = []; stepIdx = 0; regionCount = 0;
  regionMap = null; hoveredRegion = null;
  displayGrid = baseGrid.map(r => [...r]);
  updateStatus();
  hideLegend();
  setAutoBtn();
}

function reset() {
  baseGrid    = makeGrid(DEFAULT_BUILDINGS);
  displayGrid = makeGrid(DEFAULT_BUILDINGS);
  resetState();
  renderAllCells();
}

// ── FloodFill 준비 ──
function prepare() {
  const res = floodFill(baseGrid);
  steps = res.steps;
  regionCount = res.regionCount;
  return res;
}

// ── 스텝 적용 ──
function applyStepsUpTo(idx) {
  displayGrid = baseGrid.map(r => [...r]);
  regionMap   = Array.from({length: GRID_H}, () => Array(GRID_W).fill(-1));

  for (let i = 0; i <= idx && i < steps.length; i++) {
    const s = steps[i];
    if (s.type === 'visit' || s.type === 'start') {
      displayGrid[s.y][s.x] = STATE.FILLED;
      regionMap[s.y][s.x]   = s.regionID;
    }
  }
  renderAllCells();

  // 현재 스텝 펄스
  const s = steps[idx];
  if (s && (s.type === 'visit' || s.type === 'start')) {
    showPulse(s.x, s.y);
  }
}

function showPulse(x, y) {
  pulseEl.style.display = 'block';
  pulseEl.style.left   = (x * CELL + 1) + 'px';
  pulseEl.style.top    = (y * CELL + 1) + 'px';
  pulseEl.style.width  = (CELL - 2) + 'px';
  pulseEl.style.height = (CELL - 2) + 'px';
  pulseEl.style.animation = 'none';
  // reflow
  void pulseEl.offsetHeight;
  pulseEl.style.animation = 'pulse 0.28s ease-out forwards';
}

// ── 스텝 ──
function stepForward() {
  if (done) return;
  if (steps.length === 0) prepare();
  const next = stepIdx + 1;
  if (next >= steps.length) {
    setStepIdx(steps.length - 1);
    applyStepsUpTo(steps.length - 1);
    done = true;
    updateStatus();
    buildLegend();
    setAutoBtn();
    return;
  }
  setStepIdx(next);
  applyStepsUpTo(next);
  updateStatus();
}

// ── 자동 ──
function toggleAuto() {
  if (running) { pause(); return; }
  if (done) return;
  if (steps.length === 0) prepare();
  running = true;
  setAutoBtn();
  intervalID = setInterval(() => {
    const next = stepIdx + 1;
    if (next >= steps.length) {
      setStepIdx(steps.length - 1);
      applyStepsUpTo(steps.length - 1);
      done = true; running = false;
      clearInterval(intervalID);
      updateStatus();
      buildLegend();
      setAutoBtn();
      return;
    }
    setStepIdx(next);
    applyStepsUpTo(next);
    updateStatus();
  }, speed);
}

function pause() {
  clearInterval(intervalID);
  running = false;
  setAutoBtn();
}

// ── 즉시 ──
function runInstant() {
  clearInterval(intervalID);
  running = false;
  const res = prepare();
  setStepIdx(steps.length - 1);
  applyStepsUpTo(steps.length - 1);
  done = true;
  updateStatus();
  buildLegend();
  setAutoBtn();
}

// ── 드로우 모드 ──
function setMode(mode) {
  drawMode = mode;
  document.getElementById('btn-solid').className = 'btn-mode' + (mode === 'solid' ? ' active-solid' : '');
  document.getElementById('btn-erase').className = 'btn-mode' + (mode === 'erase' ? ' active-erase' : '');
}

// ── 속도 슬라이더 ──
function onSpeedChange(val) {
  // 슬라이더 오른쪽 = 빠름(낮은 ms)
  speed = 200 - parseInt(val) + 5;
  document.getElementById('speed-label').textContent = speed + 'ms';
  // 실행 중이면 재시작
  if (running) { pause(); toggleAuto(); }
}

// ── 스텝 인덱스 ──
function setStepIdx(idx) {
  stepIdx = idx;
}

// ── UI 업데이트 ──
function updateStatus() {
  const pct = steps.length > 1 ? Math.round(stepIdx / (steps.length - 1) * 100) : (done ? 100 : 0);
  document.getElementById('st-regions').textContent = regionCount;
  document.getElementById('st-step').textContent    = stepIdx;
  document.getElementById('st-total').textContent   = '/' + steps.length;
  document.getElementById('st-pct').textContent     = pct + '%';
  progFill.style.width = pct + '%';
  document.getElementById('btn-step').disabled    = done;
  document.getElementById('btn-auto').disabled    = done && !running;
}

function setAutoBtn() {
  const btn = document.getElementById('btn-auto');
  if (running) {
    btn.textContent = '⏸ 정지';
    btn.style.color = '#f48fb1';
    btn.style.borderColor = '#f48fb1';
  } else {
    btn.textContent = '▶ 자동';
    btn.style.color = '#81c784';
    btn.style.borderColor = '#81c784';
  }
}

// ── 범례 ──
function buildLegend() {
  legendEl.style.display = 'flex';
  legendEl.style.maxWidth = (GRID_W * CELL) + 'px';
  legendEl.innerHTML = '';
  for (let i = 0; i < regionCount; i++) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.rid = i;
    item.innerHTML = `
      <div class="legend-dot" style="background:${REGION_COLORS[i%REGION_COLORS.length]};border:1px solid ${REGION_STROKE[i%REGION_STROKE.length]}"></div>
      Region ${i}
    `;
    item.style.borderColor = REGION_STROKE[i % REGION_STROKE.length];
    item.addEventListener('mouseenter', () => {
      const prev = hoveredRegion;
      hoveredRegion = i;
      if (prev !== null && prev !== i) refreshRegionCells(prev);
      refreshRegionCells(i);
      updateLegendHover();
    });
    item.addEventListener('mouseleave', () => {
      const prev = hoveredRegion;
      hoveredRegion = null;
      if (prev !== null) refreshRegionCells(prev);
      updateLegendHover();
    });
    legendEl.appendChild(item);
  }
}

function hideLegend() {
  legendEl.style.display = 'none';
  legendEl.innerHTML = '';
}

function updateLegendHover() {
  for (const item of legendEl.children) {
    const rid = parseInt(item.dataset.rid);
    item.classList.toggle('hovered', rid === hoveredRegion);
  }
}

// ── 초기화 ──
baseGrid    = makeGrid(DEFAULT_BUILDINGS);
displayGrid = makeGrid(DEFAULT_BUILDINGS);
regionMap   = null;
buildSVG();
updateStatus();
</script>
