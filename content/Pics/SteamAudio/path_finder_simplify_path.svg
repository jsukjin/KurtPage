<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, sans-serif">
<rect x="0" y="0" width="900" height="420" fill="#1e1f22"/>
<text x="450" y="34" fill="#b3f594" font-size="20" font-weight="700" text-anchor="middle">simplifyPath - 지그재그 경로 단순화</text>
<text x="60" y="90" fill="#e8e8e8" font-size="14" font-weight="600">Before (baked visRange 경로)</text>
<polyline points="90,140 230,90 370,150 510,95 650,140" fill="none" stroke="#6a6a6a" stroke-width="3"/>
<circle cx="90" cy="140" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="230" cy="90" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="370" cy="150" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="510" cy="95" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="650" cy="140" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="90" y="145" fill="#e8e8e8" font-size="12" text-anchor="middle">S</text>
<text x="230" y="95" fill="#e8e8e8" font-size="12" text-anchor="middle">P1</text>
<text x="370" y="155" fill="#e8e8e8" font-size="12" text-anchor="middle">P2</text>
<text x="510" y="100" fill="#e8e8e8" font-size="12" text-anchor="middle">P3</text>
<text x="650" y="145" fill="#e8e8e8" font-size="12" text-anchor="middle">End</text>
<text x="60" y="250" fill="#e8e8e8" font-size="14" font-weight="600">After (parents[current] = grandparent 로 스킵)</text>
<polyline points="90,330 230,280 370,340 510,285 650,330" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="3 4" opacity="0.5"/>
<line x1="90" y1="330" x2="370" y2="340" stroke="#7fd858" stroke-width="4"/>
<line x1="370" y1="340" x2="650" y2="330" stroke="#7fd858" stroke-width="4"/>
<text x="200" y="315" fill="#f5c451" font-size="11">areProbesVisible(S,P2) == true</text>
<text x="480" y="315" fill="#f5c451" font-size="11">areProbesVisible(P2,End) == true</text>
<circle cx="90" cy="330" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="230" cy="280" r="14" fill="none" stroke="#555" stroke-width="2" opacity="0.6"/>
<circle cx="370" cy="340" r="18" fill="#3a6b8a" stroke="#7fd858" stroke-width="3"/>
<circle cx="510" cy="285" r="14" fill="none" stroke="#555" stroke-width="2" opacity="0.6"/>
<circle cx="650" cy="330" r="18" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="90" y="335" fill="#e8e8e8" font-size="12" text-anchor="middle">S</text>
<text x="230" y="284" fill="#888" font-size="11" text-anchor="middle">P1</text>
<text x="370" y="345" fill="#e8e8e8" font-size="12" text-anchor="middle">P2</text>
<text x="510" y="289" fill="#888" font-size="11" text-anchor="middle">P3</text>
<text x="650" y="335" fill="#e8e8e8" font-size="12" text-anchor="middle">End</text>
<text x="450" y="400" fill="#aaaaaa" font-size="13" text-anchor="middle">i가 i+2를 직접 볼 수 있으면 i+1을 건너뛰고 최종 경로를 더 매끄럽게 만든다</text>
</svg>
