<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Segoe UI, sans-serif">
<rect x="0" y="0" width="1000" height="460" fill="#1e1f22"/>
<text x="500" y="30" fill="#b3f594" font-size="18" font-weight="700" text-anchor="middle">Steam Audio Core - 전체 데이터 흐름</text>

<rect x="30" y="60" width="180" height="70" rx="8" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="120" y="90" fill="#e8e8e8" font-size="13" text-anchor="middle" font-weight="600">1. Scene / Geometry</text>
<text x="120" y="110" fill="#aaa" font-size="10" text-anchor="middle">Mesh, BVH, Material</text>

<rect x="260" y="60" width="180" height="70" rx="8" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="350" y="90" fill="#e8e8e8" font-size="13" text-anchor="middle" font-weight="600">2. Probe / Baking</text>
<text x="350" y="110" fill="#aaa" font-size="10" text-anchor="middle">ProbeBatch, PathFinder</text>
<text x="350" y="122" fill="#f5c451" font-size="9" text-anchor="middle">(로딩 전, 오프라인)</text>

<rect x="490" y="60" width="180" height="70" rx="8" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="580" y="90" fill="#e8e8e8" font-size="13" text-anchor="middle" font-weight="600">3. Simulation</text>
<text x="580" y="110" fill="#aaa" font-size="10" text-anchor="middle">Direct / Reflection / Path</text>
<text x="580" y="122" fill="#f5c451" font-size="9" text-anchor="middle">(매 프레임, 실시간)</text>

<rect x="720" y="60" width="180" height="70" rx="8" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="810" y="90" fill="#e8e8e8" font-size="13" text-anchor="middle" font-weight="600">4. DSP Effect</text>
<text x="810" y="110" fill="#aaa" font-size="10" text-anchor="middle">Direct/Reverb/Binaural</text>

<line x1="210" y1="95" x2="255" y2="95" stroke="#7fd858" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="440" y1="95" x2="485" y2="95" stroke="#7fd858" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="670" y1="95" x2="715" y2="95" stroke="#7fd858" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="380" y="200" width="240" height="60" rx="8" fill="#3a6b8a" stroke="#7fd858" stroke-width="2"/>
<text x="500" y="228" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">최종 믹싱 출력 (Speaker/Headphone)</text>
<text x="500" y="245" fill="#cde" font-size="10" text-anchor="middle">여러 DSP Effect의 결과를 합침</text>

<line x1="810" y1="130" x2="810" y2="180" stroke="#7fd858" stroke-width="3"/>
<line x1="810" y1="180" x2="620" y2="180" stroke="#7fd858" stroke-width="3"/>
<line x1="620" y1="180" x2="620" y2="195" stroke="#7fd858" stroke-width="3" marker-end="url(#arrow)"/>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 z" fill="#7fd858"/>
</marker>
</defs>

<text x="500" y="300" fill="#e8e8e8" font-size="14" font-weight="600" text-anchor="middle">왜 2단계와 3단계가 분리되어 있을까?</text>
<text x="500" y="325" fill="#aaa" font-size="12" text-anchor="middle">레벨 지오메트리는 게임 도중 안 바뀌므로, 비싼 계산(경로 탐색, 반사 시뮬레이션)은</text>
<text x="500" y="343" fill="#aaa" font-size="12" text-anchor="middle">미리 구워두고(Bake), 실시간에는 소스/리스너 위치만 반영해 가볍게 재계산한다.</text>

<text x="500" y="390" fill="#e8e8e8" font-size="14" font-weight="600" text-anchor="middle">하드웨어 백엔드는 교체 가능한 부품이다</text>
<text x="500" y="415" fill="#aaa" font-size="12" text-anchor="middle">Embree(CPU) / RadeonRays(GPU) / OpenCL / TrueAudioNext 중 하나가</text>
<text x="500" y="433" fill="#aaa" font-size="12" text-anchor="middle">Factory 패턴으로 선택되어 2, 3단계의 실제 연산을 담당한다.</text>
</svg>
