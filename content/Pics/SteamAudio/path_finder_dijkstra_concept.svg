<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, sans-serif">
<rect x="0" y="0" width="1000" height="300" fill="#1e1f22"/>
<text x="500" y="28" fill="#b3f594" font-size="18" font-weight="700" text-anchor="middle">Dijkstra 기초 개념 - 지금까지 가장 싼 곳부터 하나씩 확정한다</text>
<line x1="250" y1="45" x2="250" y2="290" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<line x1="500" y1="45" x2="500" y2="290" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<line x1="750" y1="45" x2="750" y2="290" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<g>
<line x1="35" y1="160" x2="100" y2="90" stroke="#555" stroke-dasharray="4 3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<text x="67" y="118" fill="#888" font-size="11">2.0</text>
<text x="60" y="205" fill="#888" font-size="11">5.0</text>
<text x="130" y="118" fill="#888" font-size="11">1.0</text>
<text x="130" y="205" fill="#888" font-size="11">1.0</text>
<text x="195" y="152" fill="#888" font-size="11">2.0</text>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="225" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="100" y="234" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="165" y="164" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="225" y="164" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="10" y="140" fill="#f5c451" font-size="11">cost 0</text>
<text x="125" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">1단계: S만 확정 (cost 0)</text>
</g>
<g transform="translate(250,0)">
<line x1="35" y1="160" x2="100" y2="90" stroke="#7fd858" stroke-width="3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="225" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#e8e8e8" font-size="11" text-anchor="middle">1</text>
<text x="100" y="234" fill="#888" font-size="10" text-anchor="middle">5.0</text>
<text x="165" y="164" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="225" y="164" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="105" y="75" fill="#f5c451" font-size="11">cost 2 (최소!)</text>
<text x="125" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">2단계: 미방문 중 가장 싼 노드1 확정</text>
</g>
<g transform="translate(500,0)">
<line x1="35" y1="160" x2="100" y2="90" stroke="#7fd858" stroke-width="3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#7fd858" stroke-width="3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="225" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#e8e8e8" font-size="11" text-anchor="middle">1</text>
<text x="100" y="234" fill="#888" font-size="10" text-anchor="middle">5.0</text>
<text x="165" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">3</text>
<text x="225" y="164" fill="#888" font-size="10" text-anchor="middle">?</text>
<text x="170" y="145" fill="#f5c451" font-size="11">cost 3 (최소!)</text>
<text x="125" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">3단계: 1을 거쳐 노드3 확정 (2+1=3)</text>
</g>
<g transform="translate(750,0)">
<line x1="35" y1="160" x2="100" y2="90" stroke="#7fd858" stroke-width="3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#3a3a3a" stroke-width="2"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#7fd858" stroke-width="3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#3a3a3a" stroke-width="2"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#7fd858" stroke-width="3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="#2d5b3e" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="225" cy="160" r="18" fill="#3a6b8a" stroke="#7fd858" stroke-width="3"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#e8e8e8" font-size="11" text-anchor="middle">1</text>
<text x="100" y="234" fill="#ccc" font-size="10" text-anchor="middle">5.0</text>
<text x="165" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">3</text>
<text x="225" y="164" fill="#fff" font-size="10" text-anchor="middle">End</text>
<text x="200" y="145" fill="#f5c451" font-size="11">cost 5</text>
<text x="125" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">4단계: 3을 거쳐 End 확정 (3+2=5) 완료!</text>
</g>
</svg>
