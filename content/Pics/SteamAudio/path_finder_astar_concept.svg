<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, sans-serif">
<rect x="0" y="0" width="1000" height="300" fill="#1e1f22"/>
<text x="500" y="28" fill="#b3f594" font-size="18" font-weight="700" text-anchor="middle">A* 기초 개념 - 목적지 방향이 보이는 쪽부터 먼저 가본다</text>
<line x1="333" y1="45" x2="333" y2="290" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<line x1="666" y1="45" x2="666" y2="290" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<g>
<line x1="35" y1="160" x2="100" y2="90" stroke="#555" stroke-dasharray="4 3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="225" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#888" font-size="10" text-anchor="middle">1</text>
<text x="100" y="234" fill="#888" font-size="10" text-anchor="middle">2</text>
<text x="165" y="164" fill="#888" font-size="10" text-anchor="middle">3</text>
<text x="225" y="164" fill="#888" font-size="9" text-anchor="middle">End</text>
<text x="105" y="70" fill="#f5c451" font-size="10">h=4 (End까지 대략 4)</text>
<text x="105" y="255" fill="#f5c451" font-size="10">h=5</text>
<text x="170" y="140" fill="#f5c451" font-size="10">h=2</text>
<text x="10" y="140" fill="#f5c451" font-size="10">g=0</text>
<text x="166" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">1단계: 각 노드까지 남은 대략 거리(h)를 미리 알고 시작</text>
</g>
<g transform="translate(333,0)">
<line x1="35" y1="160" x2="100" y2="90" stroke="#7fd858" stroke-width="3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#555" stroke-dasharray="4 3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="165" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="225" cy="160" r="15" fill="none" stroke="#555" stroke-width="2"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#e8e8e8" font-size="11" text-anchor="middle">1</text>
<text x="100" y="234" fill="#888" font-size="10" text-anchor="middle">2</text>
<text x="165" y="164" fill="#888" font-size="10" text-anchor="middle">3</text>
<text x="225" y="164" fill="#888" font-size="9" text-anchor="middle">End</text>
<text x="105" y="72" fill="#f5c451" font-size="10">f = g2+h4 = 6</text>
<text x="105" y="255" fill="#888" font-size="10">f = g5+h5 = 10 (더 큼)</text>
<text x="166" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">2단계: f(=g+h) 가장 작은 노드1 먼저 선택</text>
</g>
<g transform="translate(666,0)">
<line x1="35" y1="160" x2="100" y2="90" stroke="#7fd858" stroke-width="3"/>
<line x1="35" y1="160" x2="100" y2="230" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="100" y1="90" x2="165" y2="160" stroke="#7fd858" stroke-width="3"/>
<line x1="100" y1="230" x2="165" y2="160" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="165" y1="160" x2="225" y2="160" stroke="#7fd858" stroke-width="3"/>
<circle cx="35" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="90" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="100" cy="230" r="15" fill="none" stroke="#3a3a3a" stroke-width="2"/>
<circle cx="165" cy="160" r="17" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="225" cy="160" r="18" fill="#3a6b8a" stroke="#7fd858" stroke-width="3"/>
<text x="35" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">S</text>
<text x="100" y="94" fill="#e8e8e8" font-size="11" text-anchor="middle">1</text>
<text x="100" y="234" fill="#555" font-size="10" text-anchor="middle">2</text>
<text x="165" y="164" fill="#e8e8e8" font-size="11" text-anchor="middle">3</text>
<text x="225" y="164" fill="#fff" font-size="9" text-anchor="middle">End</text>
<text x="60" y="255" fill="#555" font-size="10">한 번도 안 감!</text>
<text x="166" y="270" fill="#e8e8e8" font-size="12" text-anchor="middle">3단계: End 도착. 노드2 쪽은 아예 안 가봄</text>
</g>
</svg>
