<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Segoe UI, sans-serif">
<rect x="0" y="0" width="920" height="480" fill="#1e1f22"/>
<text x="230" y="34" fill="#b3f594" font-size="20" font-weight="700" text-anchor="middle">Dijkstra - findAllShortestPaths (Baking)</text>
<text x="690" y="34" fill="#b3f594" font-size="20" font-weight="700" text-anchor="middle">A* - findShortestPath (Runtime)</text>
<line x1="460" y1="50" x2="460" y2="460" stroke="#444" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="90" y1="260" x2="190" y2="150" stroke="#6a6a6a"/>
<line x1="90" y1="260" x2="190" y2="370" stroke="#6a6a6a"/>
<line x1="190" y1="150" x2="300" y2="150" stroke="#6a6a6a"/>
<line x1="190" y1="370" x2="300" y2="370" stroke="#6a6a6a"/>
<line x1="300" y1="150" x2="400" y2="260" stroke="#6a6a6a"/>
<line x1="300" y1="370" x2="400" y2="260" stroke="#6a6a6a"/>
<line x1="190" y1="150" x2="300" y2="370" stroke="#6a6a6a" stroke-dasharray="3 3"/>
<circle cx="90" cy="260" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="190" cy="150" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="190" cy="370" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="300" cy="150" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="300" cy="370" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="400" cy="260" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<text x="90" y="265" fill="#e8e8e8" font-size="13" text-anchor="middle">S</text>
<text x="190" y="155" fill="#e8e8e8" font-size="13" text-anchor="middle">A</text>
<text x="190" y="375" fill="#e8e8e8" font-size="13" text-anchor="middle">B</text>
<text x="300" y="155" fill="#e8e8e8" font-size="13" text-anchor="middle">C</text>
<text x="300" y="375" fill="#e8e8e8" font-size="13" text-anchor="middle">D</text>
<text x="400" y="265" fill="#e8e8e8" font-size="13" text-anchor="middle">E</text>
<text x="65" y="245" fill="#f5c451" font-size="12">1</text>
<text x="165" y="130" fill="#f5c451" font-size="12">2</text>
<text x="165" y="395" fill="#f5c451" font-size="12">3</text>
<text x="275" y="130" fill="#f5c451" font-size="12">4</text>
<text x="275" y="395" fill="#f5c451" font-size="12">5</text>
<text x="375" y="250" fill="#f5c451" font-size="12">6</text>
<text x="230" y="450" fill="#aaaaaa" font-size="13" text-anchor="middle">모든 노드를 방문할 때까지 계속 확장 - start 기준 전체 probe까지의 최단거리 표를 만든다</text>
<line x1="550" y1="260" x2="650" y2="150" stroke="#7fd858" stroke-width="4"/>
<line x1="550" y1="260" x2="650" y2="370" stroke="#555" stroke-dasharray="3 3"/>
<line x1="650" y1="150" x2="760" y2="150" stroke="#7fd858" stroke-width="4"/>
<line x1="650" y1="370" x2="760" y2="370" stroke="#555" stroke-dasharray="3 3"/>
<line x1="760" y1="150" x2="860" y2="260" stroke="#7fd858" stroke-width="4"/>
<line x1="760" y1="370" x2="860" y2="260" stroke="#555" stroke-dasharray="3 3"/>
<text x="835" y="190" fill="#f5c451" font-size="11">h(C,End)</text>
<circle cx="550" cy="260" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="650" cy="150" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="650" cy="370" r="20" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="760" cy="150" r="20" fill="#2d5b3e" stroke="#b3f594" stroke-width="2"/>
<circle cx="760" cy="370" r="20" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="860" cy="260" r="20" fill="#3a6b8a" stroke="#7fd858" stroke-width="3"/>
<text x="550" y="265" fill="#e8e8e8" font-size="13" text-anchor="middle">S</text>
<text x="650" y="155" fill="#e8e8e8" font-size="13" text-anchor="middle">A</text>
<text x="650" y="375" fill="#888" font-size="13" text-anchor="middle">B</text>
<text x="760" y="155" fill="#e8e8e8" font-size="13" text-anchor="middle">C</text>
<text x="760" y="375" fill="#888" font-size="13" text-anchor="middle">D</text>
<text x="860" y="265" fill="#e8e8e8" font-size="13" text-anchor="middle">End</text>
<text x="690" y="450" fill="#aaaaaa" font-size="13" text-anchor="middle">비용+휴리스틱(h)으로 정렬 - B, D는 방문 순서가 밀려 탐색되지 않고, End를 pop하면 즉시 종료</text>
</svg>
